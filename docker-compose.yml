services:
  web:                      # React UI + REST API  ->  http://localhost:8000
    build: .
    command: python -m server.app
    env_file: .env
    environment: [TZ=Asia/Kolkata, HOST=0.0.0.0]
    ports: ["127.0.0.1:8000:8000"]   # drop "127.0.0.1:" to expose on your network (set APP_TOKEN first!)
    volumes: [./data:/app/data, ./config.yaml:/app/config.yaml]
    restart: unless-stopped

  notifier:                 # System 1: Telegram alerts + AI news digests
    build: .
    command: python -m notifier.run
    env_file: .env
    environment: [TZ=Asia/Kolkata]
    volumes: [./data:/app/data, ./config.yaml:/app/config.yaml]
    restart: unless-stopped

  autotrader:               # System 2: paper / live trading
    build: .
    command: python -m autotrader.run
    env_file: .env
    environment: [TZ=Asia/Kolkata]
    volumes: [./data:/app/data, ./config.yaml:/app/config.yaml]
    restart: unless-stopped
