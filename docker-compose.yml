services:
  notifier:
    build: .
    command: python -m notifier.run
    env_file: .env
    environment: [TZ=Asia/Kolkata]
    volumes: [./data:/app/data, ./config.yaml:/app/config.yaml]
    restart: unless-stopped

  autotrader:
    build: .
    command: python -m autotrader.run
    env_file: .env
    environment: [TZ=Asia/Kolkata]
    volumes: [./data:/app/data, ./config.yaml:/app/config.yaml]
    restart: unless-stopped

  web:
    build: .
    command: uvicorn web.server:app --host 0.0.0.0 --port 8000
    env_file: .env
    ports: ["8000:8000"]
    volumes: [./data:/app/data, ./config.yaml:/app/config.yaml]
    restart: unless-stopped
