# ─────────────────────────────────────────────────────────────
# StockPilot configuration (NSE / BSE)
# Secrets (API keys, tokens) go in .env — never in this file.
# ─────────────────────────────────────────────────────────────

watchlist:            # NSE symbols (use exchange: BSE for BSE codes)
  - RELIANCE
  - TCS
  - HDFCBANK
  - INFY
  - ICICIBANK
  - SBIN
  - ITC
  - LT
  - BHARTIARTL
  - AXISBANK
  - TMPV            # Tata Motors Passenger Vehicles (TATAMOTORS was delisted after the Oct-2025 demerger)
  - SUNPHARMA

exchange: NSE         # NSE or BSE (yfinance suffix .NS / .BO)

data:
  source: yfinance    # yfinance (free, delayed) | openalgo (live, via your broker)
  interval: 1d        # 1d for swing; 15m / 5m for intraday
  lookback_days: 400  # need >200 bars for SMA200

scoring:
  weights: {technical: 0.50, fundamental: 0.25, news: 0.25}
  buy_threshold: 0.35     # combined score is in [-1, +1]
  sell_threshold: -0.35
  stop_atr_mult: 1.5      # stop-loss = entry -/+ 1.5 x ATR(14)
  reward_risk: 2.0        # target = entry +/- 2 x risk

news:
  max_age_hours: 36
  feeds:                  # public RSS feeds (Indian markets)
    - https://economictimes.indiatimes.com/markets/rssfeeds/1977021501.cms
    - https://www.moneycontrol.com/rss/marketreports.xml
    - https://www.business-standard.com/rss/markets-106.rss
    - https://www.livemint.com/rss/markets
    - https://nsearchives.nseindia.com/content/RSS/Online_announcements.xml
  google_news_per_symbol: true   # adds "<SYMBOL> share" query from Google News RSS

# LLM providers are tried in order; first one with a key (or reachable) wins.
# All are OpenAI-compatible /chat/completions endpoints with free tiers, serving OPEN-SOURCE models
# (Llama, gpt-oss, Qwen, DeepSeek). Override any model without editing this file via its *_MODEL env var.
# A provider that fails (bad key / wrong model / offline) is skipped for `failure_cooldown_minutes`,
# and the provider's own error text is logged so you can see what to fix.
llm:
  enabled: true
  temperature: 0.1
  timeout_seconds: 60
  failure_cooldown_minutes: 15
  providers:
    - name: groq                # console.groq.com — fastest, generous free tier
      base_url: https://api.groq.com/openai/v1
      model: llama-3.3-70b-versatile
      model_env: GROQ_MODEL     # e.g. openai/gpt-oss-120b, qwen/qwen3-32b
      api_key_env: GROQ_API_KEY
    - name: cerebras            # cloud.cerebras.ai — free tier
      base_url: https://api.cerebras.ai/v1
      model: llama-3.3-70b
      model_env: CEREBRAS_MODEL
      api_key_env: CEREBRAS_API_KEY
    - name: huggingface         # huggingface.co/settings/tokens — free monthly credits
      base_url: https://router.huggingface.co/v1
      model: meta-llama/Llama-3.3-70B-Instruct
      model_env: HF_MODEL
      api_key_env: HF_TOKEN
    - name: openrouter          # openrouter.ai/keys — ":free" models
      base_url: https://openrouter.ai/api/v1
      model: meta-llama/llama-3.3-70b-instruct:free
      model_env: OPENROUTER_MODEL
      api_key_env: OPENROUTER_API_KEY
    - name: ollama              # fully local + free, no key (ollama pull llama3.1)
      base_url: http://localhost:11434/v1
      model: llama3.1
      model_env: OLLAMA_MODEL
      api_key_env: ""
    - name: gemini              # optional, not open-source (last resort)
      base_url: https://generativelanguage.googleapis.com/v1beta/openai
      model: gemini-2.5-flash
      model_env: GEMINI_MODEL
      api_key_env: GEMINI_API_KEY

# ── AI news scanner: "should I buy this stock?" from the news ──
news_scanner:
  enabled: true
  every_minutes: 30           # how often to scan for new news
  active_from: "07:30"        # IST window in which scheduled scans run
  active_to: "22:00"
  weekends: false
  nse_announcements: true     # NSE corporate filings (order wins, results, dividends, M&A, penalties…)
  bse_announcements: true     # BSE corporate filings
  announcement_hours: 24
  google_news_queries:        # extra Google News searches (any source)
    - NSE stock order win
    - Indian stocks results today
    - Sensex Nifty market news
  max_market_items: 80
  max_items_per_run: 40       # newest + most important items sent to the LLM per scan
  llm_batch_size: 12
  llm_max_tokens: 4000
  confirm_with_technicals: true   # run chart + fundamental check on each BUY/WATCH stock
  max_technical_checks: 8
  min_tech_score_for_buy: -0.2    # news BUY on a falling chart -> downgraded to WATCH
  min_confidence: 0.55        # Telegram alert only when a BUY/SELL/AVOID is at least this confident
  send_watch_only_digests: false
  max_cards: 12
  remember_items: 3000        # already-analysed items are not re-sent

# ── System 1: notifications ──────────────────────────────────
notifier:
  scan_every_minutes: 15
  premarket_brief: "08:45"
  eod_report: "15:45"
  send_charts: true
  only_on_change: true      # alert only when BUY/SELL/HOLD flips for a stock
  min_confidence: 0.35      # |combined score| needed to alert

# ── System 2: auto-trading ───────────────────────────────────
autotrader:
  mode: paper               # paper | live   (live requires OpenAlgo + broker)
  capital: 100000           # INR allocated to the bot
  product: CNC              # CNC (delivery) | MIS (intraday, auto square-off)
  risk_per_trade_pct: 1.0   # max loss per trade as % of capital
  max_position_pct: 20      # max capital in one stock
  max_open_positions: 5
  max_daily_loss_pct: 2.0   # kill-switch: stop new entries for the day
  max_orders_per_second: 5  # SEBI cap is 10/s — stay well below
  no_new_entries_after: "14:45"
  mis_square_off: "15:10"
  allow_short: false        # shorting only valid for MIS
  llm_confirm: true         # LLM must agree before any entry
  tradingagents_confirm: false  # optional deep multi-agent check (slow)
  loop_every_minutes: 5

market:
  timezone: Asia/Kolkata
  open: "09:15"
  close: "15:30"
  holidays: []              # add NSE holidays as "YYYY-MM-DD"

# ── Web app (python -m server.app) ───────────────────────────
server:
  host: 127.0.0.1             # 0.0.0.0 to expose on your network (then set APP_TOKEN in .env!)
  port: 8000
  background_jobs: true       # refresh the AI news digest on schedule inside the web app
